name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos generados al día con openapi.yaml
        run: pnpm gen:api && git diff --exit-code src/types/openapi.gen.ts
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
